<!--/*
  ==== Workmatch · Frontend · หน้า login.html ====
  หน้าที่: หน้าเข้าสู่ระบบ
  แสดงโดย: AuthController (GET /login)
  ส่งฟอร์มไปที่: POST /login
  ใช้ชิ้นส่วนร่วมจาก: fragments/layout.html, สไตล์จาก static/css/style.css
*/-->
<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('เข้าสู่ระบบ')}"><title>เข้าสู่ระบบ | Workmatch</title></head>
<!--/* หน้าจอเข้าสู่ระบบ ตามเอกสาร รูปที่ 33: การ์ดกลางจอ ไม่มี header */-->
<body>
<main id="main" class="auth-page">
  <section class="auth-card" aria-labelledby="login-title">
    <a class="auth-logo" th:href="@{/}"><img src="/images/workmatch.svg" th:src="@{/images/workmatch.svg}" alt="Workmatch หน้าแรก" width="150" height="32" /></a>
    <h1 id="login-title">เข้าสู่ระบบ</h1>
    <p class="lead">สำหรับนักศึกษาและสถานประกอบการ ใช้อีเมลที่ลงทะเบียนไว้</p>
    <div class="alert error" role="alert" th:if="${param.error != null}">อีเมลหรือรหัสผ่านไม่ถูกต้อง (ตัวพิมพ์ใหญ่-เล็กของรหัสผ่านมีผล)</div>
    <div class="alert info" role="status" th:if="${param.expired != null}">หน้าเดิมหมดอายุแล้ว กรุณาเข้าสู่ระบบอีกครั้ง</div>
    <div class="alert success" role="status" th:if="${param.logout != null}">ออกจากระบบแล้ว</div>
    <div class="alert success" role="status" th:if="${param.registered != null}">สมัครสมาชิกสำเร็จ กรุณาเข้าสู่ระบบ</div>
    <form method="post" th:action="@{/login}">
      <div class="field"><label for="username">อีเมล <span class="req" aria-hidden="true">*</span></label><input id="username" name="username" type="email" autocomplete="username" required="required" placeholder="example@up.ac.th" /></div>
      <div class="field"><label for="password">รหัสผ่าน <span class="req" aria-hidden="true">*</span></label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required="required" /></div></div>
      <button class="full" type="submit">เข้าสู่ระบบ</button>
    </form>
    <p class="auth-switch">ยังไม่มีบัญชีใช่หรือไม่? <a th:href="@{/register}">สมัครสมาชิก</a></p>
  </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body></html>
