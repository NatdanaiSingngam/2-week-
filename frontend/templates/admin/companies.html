<!--/*
  ==== Workmatch · Frontend · หน้า admin/companies.html ====
  หน้าที่: ตรวจสอบและอนุมัติสถานประกอบการ
  แสดงโดย: AdminController (GET /admin/companies)
  ข้อมูลที่ได้รับจาก Controller: section, requests
  ส่งฟอร์มไปที่: POST /admin/companies/{id}/review
  ใช้ชิ้นส่วนร่วมจาก: fragments/layout.html, สไตล์จาก static/css/style.css
*/-->
<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('อนุมัติสถานประกอบการ')}"><title>อนุมัติสถานประกอบการ | Workmatch</title></head>
<!--/* หน้าจอตรวจสอบและอนุมัติสถานประกอบการ ตามเอกสาร รูปที่ 49 */-->
<body class="admin-body">
<aside th:replace="~{fragments/layout :: adminSidebar(${section})}"></aside>
<main id="main" class="admin-main">
<div class="page-title"><h1>ตรวจสอบและอนุมัติสถานประกอบการ</h1><p>พิจารณาเอกสารยืนยันตัวตน (ภ.พ.20) ของบริษัทที่สมัครเข้ามาใหม่</p></div>
<th:block th:replace="~{fragments/layout :: flash}"></th:block>
<div class="card empty" th:if="${#lists.isEmpty(requests)}"><p>ยังไม่มีคำขอยืนยันตัวตน</p></div>
<section class="card table-card" th:if="${not #lists.isEmpty(requests)}" aria-label="คำขอยืนยันตัวตน">
  <div class="table-wrap">
    <table>
      <thead><tr><th scope="col">ชื่อสถานประกอบการ / เลขนิติบุคคล</th><th scope="col">วันที่สมัคร</th><th scope="col">เอกสารแนบ</th><th scope="col">สถานะ</th><th scope="col" style="text-align:right">การจัดการ</th></tr></thead>
      <tbody>
        <tr th:each="r : ${requests}">
          <td><strong th:text="${r.companyName()}">บริษัท</strong><div class="muted" style="font-size:.82rem" th:text="${'เลขประจำตัว: ' + (r.taxId() != null ? r.taxId() : '-')}">เลขประจำตัว</div></td>
          <td th:text="${@fmt.date(r.submittedAt())}">31 ส.ค. 2569</td>
          <td><a class="table-link" th:if="${r.documentFileId() != null}" th:href="@{/admin/companies/{id}/document(id=${r.userId()})}" target="_blank" rel="noopener" th:aria-label="${'ดูไฟล์ PDF ของ ' + r.companyName()}">ดูไฟล์ PDF</a><span th:if="${r.documentFileId() == null}">-</span></td>
          <td><span class="status" th:classappend="${r.status().name() == 'REJECTED' ? 'CLOSED' : r.status().name()}" th:text="${r.status().label}">รออนุมัติ</span></td>
          <td style="text-align:right">
            <div class="actions" style="justify-content:flex-end" th:if="${r.status().name() == 'PENDING'}">
              <form method="post" class="inline-form" th:action="@{/admin/companies/{id}/review(id=${r.userId()})}"><input type="hidden" name="decision" value="approve" /><button type="submit" class="sm" th:aria-label="${'อนุมัติ ' + r.companyName()}">อนุมัติ</button></form>
              <form method="post" class="inline-form" th:action="@{/admin/companies/{id}/review(id=${r.userId()})}" th:attr="data-confirm=${'ไม่อนุมัติ ' + r.companyName() + '?'}"><input type="hidden" name="decision" value="reject" /><button type="submit" class="secondary sm" style="color:var(--danger-text)" th:aria-label="${'ไม่อนุมัติ ' + r.companyName()}">ไม่อนุมัติ</button></form>
            </div>
            <span class="muted" style="font-size:.8rem" th:unless="${r.status().name() == 'PENDING'}" th:text="${'ตรวจสอบโดย: ' + (r.reviewedBy() != null ? r.reviewedBy() : '-')}">ตรวจสอบโดย</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body></html>
