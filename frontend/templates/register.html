<!--/*
  ==== Workmatch · Frontend · หน้า register.html ====
  หน้าที่: หน้าสมัครสมาชิก (นักศึกษา / สถานประกอบการ)
  แสดงโดย: AuthController (GET /register), AuthController (POST /register)
  ข้อมูลที่ได้รับจาก Controller: error
  ส่งฟอร์มไปที่: POST /register
  ใช้ชิ้นส่วนร่วมจาก: fragments/layout.html, สไตล์จาก static/css/style.css
*/-->
<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('สมัครสมาชิก')}"><title>สมัครสมาชิก | Workmatch</title></head>
<!--/* หน้าจอลงทะเบียน ตามเอกสาร รูปที่ 34 (นักศึกษา) และ 35 (สถานประกอบการ)
     สลับแท็บด้วย JavaScript (กลุ่มที่ซ่อนจะ disabled ไม่ถูกส่ง) ถ้าปิด JavaScript ใช้ลิงก์ ?role=COMPANY แทน */-->
<body data-role-theme="true" th:with="company=${param.role != null and param.role[0] == 'COMPANY'}" th:classappend="${company} ? 'theme-company'">
<main id="main" class="auth-page">
  <section class="auth-card wide" aria-labelledby="register-title">
    <a class="auth-logo" th:href="@{/}"><img src="/images/workmatch.svg" th:src="@{/images/workmatch.svg}" alt="Workmatch หน้าแรก" width="150" height="32" /></a>
    <h1 id="register-title">สร้างบัญชีผู้ใช้งาน</h1>
    <p class="lead" data-role-text="" data-text-student="เริ่มต้นใช้งานแพลตฟอร์ม Workmatch" data-text-company="เริ่มต้นค้นหานักศึกษาฝึกงานที่ใช่สำหรับองค์กรของคุณ" th:text="${company} ? 'เริ่มต้นค้นหานักศึกษาฝึกงานที่ใช่สำหรับองค์กรของคุณ' : 'เริ่มต้นใช้งานแพลตฟอร์ม Workmatch'">เริ่มต้นใช้งานแพลตฟอร์ม Workmatch</p>
    <div class="alert error" role="alert" th:if="${error != null}" th:text="${error}"></div>
    <form method="post" th:action="@{/register}">
      <fieldset><legend class="visually-hidden">ประเภทบัญชี</legend>
        <div class="segmented">
          <label><input type="radio" name="role" value="STUDENT" required="required" checked="checked" th:checked="${!company}" />นักศึกษา</label>
          <label><input type="radio" name="role" value="COMPANY" th:checked="${company}" />สถานประกอบการ</label>
        </div>
      </fieldset>

      <div data-role-section="STUDENT" th:attr="hidden=${company} ? 'hidden'">
        <div class="form-grid">
          <div class="field"><label for="s-first">ชื่อจริง</label><input id="s-first" name="firstName" required="required" autocomplete="given-name" placeholder="ชื่อ" th:disabled="${company}" th:value="${!company and param.firstName != null ? param.firstName[0] : ''}" /></div>
          <div class="field"><label for="s-last">นามสกุล</label><input id="s-last" name="lastName" required="required" autocomplete="family-name" placeholder="นามสกุล" th:disabled="${company}" th:value="${!company and param.lastName != null ? param.lastName[0] : ''}" /></div>
        </div>
        <div class="field"><label for="s-id">รหัสนิสิต (8 หลัก)</label><input id="s-id" name="studentId" required="required" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" placeholder="เช่น 66XXXXXX" th:disabled="${company}" th:value="${param.studentId != null ? param.studentId[0] : ''}" /></div>
        <div class="field"><label for="s-email">อีเมล</label><input id="s-email" name="email" type="email" autocomplete="username" required="required" placeholder="example@up.ac.th" th:disabled="${company}" th:value="${!company and param.email != null ? param.email[0] : ''}" /></div>
      </div>

      <div data-role-section="COMPANY" th:attr="hidden=${!company} ? 'hidden'">
        <div class="form-grid">
          <div class="field"><label for="c-first">ชื่อผู้ติดต่อ</label><input id="c-first" name="firstName" required="required" autocomplete="given-name" placeholder="ชื่อจริง" th:disabled="${!company}" th:value="${company and param.firstName != null ? param.firstName[0] : ''}" /></div>
          <div class="field"><label for="c-last">นามสกุล</label><input id="c-last" name="lastName" required="required" autocomplete="family-name" placeholder="นามสกุล" th:disabled="${!company}" th:value="${company and param.lastName != null ? param.lastName[0] : ''}" /></div>
        </div>
        <div class="field"><label for="c-name">ชื่อสถานประกอบการ</label><input id="c-name" name="companyName" required="required" autocomplete="organization" placeholder="เช่น บริษัท ตัวอย่าง จำกัด" th:disabled="${!company}" th:value="${param.companyName != null ? param.companyName[0] : ''}" /></div>
        <div class="field"><label for="c-tax">เลขประจำตัวผู้เสียภาษี (13 หลัก)</label><input id="c-tax" name="taxId" required="required" inputmode="numeric" pattern="[0-9]{13}" maxlength="13" placeholder="0105XXXXXXXXX" th:disabled="${!company}" th:value="${param.taxId != null ? param.taxId[0] : ''}" /></div>
        <div class="field"><label for="c-email">อีเมลองค์กร</label><input id="c-email" name="email" type="email" autocomplete="username" required="required" placeholder="hr@yourcompany.com" th:disabled="${!company}" th:value="${company and param.email != null ? param.email[0] : ''}" /></div>
      </div>

      <div class="field"><label for="password">รหัสผ่าน</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required="required" aria-describedby="password-note" placeholder="กำหนดรหัสผ่านอย่างน้อย 8 ตัวอักษร" /></div><p id="password-note" class="field-note">ใช้รหัสผ่านอย่างน้อย 8 ตัวอักษร</p></div>
      <button class="full" type="submit" data-role-text="" data-text-student="สมัครสมาชิก" data-text-company="สมัครสมาชิกสถานประกอบการ" th:text="${company} ? 'สมัครสมาชิกสถานประกอบการ' : 'สมัครสมาชิก'">สมัครสมาชิก</button>
    </form>
    <p class="auth-switch"><span data-role-text="" data-text-student="มีบัญชีอยู่แล้ว?" data-text-company="มีบัญชีองค์กรอยู่แล้วใช่หรือไม่?" th:text="${company} ? 'มีบัญชีองค์กรอยู่แล้วใช่หรือไม่?' : 'มีบัญชีอยู่แล้ว?'">มีบัญชีอยู่แล้ว?</span> <a th:href="@{/login}">เข้าสู่ระบบ</a></p>
  </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body></html>
