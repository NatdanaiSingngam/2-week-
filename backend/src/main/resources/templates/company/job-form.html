<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('สร้างประกาศงาน')}"><title>สร้างประกาศงาน | Workmatch</title></head>
<!--/* สร้างประกาศรับสมัครงานใหม่ ตามเอกสาร รูปที่ 44 (ฟอร์ม)
     ช่องค่าตอบแทน วันเวลาทำงาน สวัสดิการ และการเลือกทักษะจากพจนานุกรมในรูปยังไม่มีใน backend: ตอนนี้ระบบดึงทักษะจากรายละเอียดงานด้วย NLP */-->
<body class="theme-company"><header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="narrow main">
<a class="back-link" th:href="@{/company/jobs}"><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg>กลับไปรายการตำแหน่ง</a>
<section class="card" aria-labelledby="form-title">
  <h1 id="form-title">สร้างประกาศรับสมัครงานใหม่</h1>
  <p class="muted">ระบุรายละเอียดตำแหน่งงานและทักษะที่ต้องการ เพื่อให้ระบบคำนวณและจับคู่กับนิสิตที่ตรงสเปกที่สุด</p>
  <div class="alert error" role="alert" th:if="${error != null}" th:text="${error}"></div>
  <form method="post" th:action="@{/company/jobs}" data-busy="กำลังบันทึก...">
    <div class="field"><label for="title">ชื่อตำแหน่งงาน <span class="req" aria-hidden="true">*</span></label><input id="title" name="title" maxlength="200" required="required" th:value="${job?.title}" placeholder="เช่น Software Engineer (Intern)" /></div>
    <div class="field"><label for="description">รายละเอียดงาน (Job Description) <span class="req" aria-hidden="true">*</span></label><textarea id="description" name="description" rows="10" required="required" th:text="${job?.description}" aria-describedby="description-help" placeholder="ระบุขอบเขตความรับผิดชอบของตำแหน่งนี้ และทักษะที่ต้องการ เช่น Java, Spring Boot, SQL"></textarea><p id="description-help" class="field-note">ใส่ชื่อทักษะในข้อความได้เลย ระบบจะสกัดทักษะด้วย NLP และนำไปคำนวณ Cosine Similarity หลังบันทึก</p></div>
    <div class="form-actions"><a class="button secondary" th:href="@{/company/jobs}">ยกเลิก</a><button type="submit">เผยแพร่ประกาศงาน</button></div>
  </form>
</section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
