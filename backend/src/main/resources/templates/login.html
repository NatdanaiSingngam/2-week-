<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('เข้าสู่ระบบ')}"><title>เข้าสู่ระบบ | Workmatch</title></head>
<!--/* หน้าจอเข้าสู่ระบบ ตามเอกสาร รูปที่ 33: การ์ดกลางจอ ไม่มี header */-->
<body>
<main id="main" class="auth-page">
  <section class="auth-card" aria-labelledby="login-title">
    <a class="auth-logo" th:href="@{/}"><img src="/images/workmatch.svg" th:src="@{/images/workmatch.svg}" alt="Workmatch หน้าแรก" width="150" height="32" /></a>
    <h1 id="login-title">เข้าสู่ระบบ</h1>
    <p class="lead">จัดการโปรไฟล์และค้นหางานที่ใช่สำหรับคุณ</p>
    <div class="alert error" role="alert" th:if="${param.error != null}">อีเมลหรือรหัสผ่านไม่ถูกต้อง</div>
    <div class="alert success" role="status" th:if="${param.logout != null}">ออกจากระบบแล้ว</div>
    <div class="alert success" role="status" th:if="${param.registered != null}">สมัครสมาชิกสำเร็จ กรุณาเข้าสู่ระบบ</div>
    <form method="post" th:action="@{/login}">
      <div class="field"><label for="username">อีเมล</label><input id="username" name="username" type="email" autocomplete="username" required="required" placeholder="example@up.ac.th" /></div>
      <div class="field"><label for="password">รหัสผ่าน</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required="required" /></div></div>
      <button class="full" type="submit">เข้าสู่ระบบ</button>
    </form>
    <p class="auth-switch">ยังไม่มีบัญชีใช่หรือไม่? <a th:href="@{/register}">สมัครสมาชิก</a></p>
  </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body></html>
