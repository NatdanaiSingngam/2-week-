<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('เข้าสู่ระบบ')}"><title>เข้าสู่ระบบ | Workmatch</title></head>
<body><header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container main">
<div class="auth-shell">
  <section th:replace="~{fragments/layout :: authPanel}"></section>
  <section class="auth-form" aria-labelledby="login-title">
    <h2 id="login-title">เข้าสู่ระบบ</h2>
    <p class="lead">ยินดีต้อนรับกลับ เข้าสู่ระบบเพื่อดูผลจับคู่ของคุณ</p>
    <div class="alert error" role="alert" th:if="${param.error != null}">อีเมลหรือรหัสผ่านไม่ถูกต้อง</div>
    <div class="alert success" role="status" th:if="${param.logout != null}">ออกจากระบบแล้ว</div>
    <div class="alert success" role="status" th:if="${param.registered != null}">สมัครสมาชิกสำเร็จ กรุณาเข้าสู่ระบบ</div>
    <form method="post" th:action="@{/login}">
      <div class="field"><label for="username">อีเมล</label><input id="username" name="username" type="email" autocomplete="username" required="required" placeholder="yourname@example.com" /></div>
      <div class="field"><label for="password">รหัสผ่าน</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required="required" /></div></div>
      <button class="full" type="submit">เข้าสู่ระบบ</button>
    </form>
    <p class="auth-switch">ยังไม่มีบัญชี? <a th:href="@{/register}">สมัครสมาชิก</a></p>
  </section>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
