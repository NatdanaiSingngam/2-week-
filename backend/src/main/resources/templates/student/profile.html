<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ข้อมูลส่วนตัว')}"><title>ข้อมูลส่วนตัว | Workmatch</title></head>
<!--/* หน้าจอจัดการข้อมูลส่วนตัว ตามเอกสาร รูปที่ 36 (รูปโปรไฟล์ใช้ตัวอักษรย่อ ยังไม่มีการอัปโหลดรูป) */-->
<body><header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container main">
<div class="account-layout">
  <aside th:replace="~{fragments/layout :: accountNav(${section})}"></aside>
  <section class="card">
    <div class="profile" style="margin-bottom:8px"><span class="avatar" style="width:64px;height:64px;font-size:1.2rem" aria-hidden="true" th:text="${userInitials}">ณด</span><div><h1 style="font-size:1.3rem;margin:0" th:text="${displayName}">ชื่อ</h1><span th:text="${(profile.faculty != null ? 'นักศึกษา' + profile.faculty : 'นักศึกษาสหกิจศึกษา')}">นักศึกษาคณะ</span><span style="display:block" th:text="${email}">email</span></div></div>
    <th:block th:replace="~{fragments/layout :: flash}"></th:block>
    <form method="post" th:action="@{/student/profile}">
      <h2 class="form-section-title">ข้อมูลพื้นฐาน</h2>
      <div class="form-grid">
        <div class="field"><label for="fullName">ชื่อ-นามสกุล</label><input id="fullName" name="fullName" required="required" maxlength="150" autocomplete="name" th:value="${displayName}" /></div>
        <div class="field"><label for="phone">เบอร์โทรศัพท์</label><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="20" placeholder="08X-XXX-XXXX" th:value="${profile.phone}" /></div>
      </div>
      <h2 class="form-section-title">ข้อมูลการศึกษา</h2>
      <div class="form-grid">
        <div class="field"><label for="studentId">รหัสนิสิต</label>
          <input th:if="${profile.studentId != null}" id="studentId" readonly="readonly" th:value="${profile.studentId}" aria-describedby="sid-note" />
          <input th:if="${profile.studentId == null}" id="studentId" name="studentId" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" placeholder="66XXXXXX" aria-describedby="sid-note" />
          <p id="sid-note" class="field-note" th:text="${profile.studentId != null} ? 'รหัสนิสิตแก้ไขไม่ได้' : 'ตัวเลข 8 หลัก กรอกได้ครั้งเดียว'">รหัสนิสิตแก้ไขไม่ได้</p></div>
        <div class="field"><label for="faculty">คณะ</label><input id="faculty" name="faculty" maxlength="150" placeholder="เช่น เทคโนโลยีสารสนเทศและการสื่อสาร" th:value="${profile.faculty}" /></div>
        <div class="field span-2"><label for="major">สาขาวิชา</label><input id="major" name="major" maxlength="150" placeholder="เช่น วิทยาการคอมพิวเตอร์" th:value="${profile.major}" /></div>
      </div>
      <div class="form-actions"><a class="button secondary" th:href="@{/student/dashboard}">ยกเลิก</a><button type="submit">บันทึกข้อมูล</button></div>
    </form>
  </section>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
