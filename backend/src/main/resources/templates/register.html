<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('สมัครสมาชิก')}"><title>สมัครสมาชิก | Workmatch</title></head>
<body><header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container main">
<div class="auth-shell">
  <section th:replace="~{fragments/layout :: authPanel}"></section>
  <section class="auth-form" aria-labelledby="register-title">
    <h2 id="register-title">สมัครสมาชิก</h2>
    <p class="lead">เลือกบทบาทและสร้างบัญชีเพื่อเริ่มใช้งาน</p>
    <div class="alert error" role="alert" th:if="${error != null}" th:text="${error}"></div>
    <form method="post" th:action="@{/register}">
      <fieldset><legend>คุณต้องการใช้งานในบทบาทใด</legend>
        <div class="roles">
          <label class="role-choice"><input type="radio" name="role" value="STUDENT" required="required" checked="checked" th:checked="${param.role == null or param.role[0] != 'COMPANY'}" /><span class="role-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></span><span>นักศึกษา<small>หาตำแหน่งสหกิจศึกษา</small></span></label>
          <label class="role-choice"><input type="radio" name="role" value="COMPANY" th:checked="${param.role != null and param.role[0] == 'COMPANY'}" /><span class="role-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4M9 9h.01M9 13h.01M9 17h.01"/></svg></span><span>บริษัท<small>ประกาศตำแหน่งและดูผู้สมัคร</small></span></label>
        </div>
      </fieldset>
      <div class="field"><label for="displayName">ชื่อที่แสดง / ชื่อบริษัท</label><input id="displayName" name="displayName" required="required" autocomplete="name" th:value="${param.displayName != null ? param.displayName[0] : ''}" /></div>
      <div class="field"><label for="email">อีเมล</label><input id="email" name="email" type="email" autocomplete="username" required="required" th:value="${param.email != null ? param.email[0] : ''}" placeholder="yourname@example.com" /></div>
      <div class="field"><label for="password">รหัสผ่าน</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required="required" aria-describedby="password-note" /></div><p id="password-note" class="field-note">ใช้รหัสผ่านอย่างน้อย 8 ตัวอักษร</p></div>
      <button class="full" type="submit">สร้างบัญชี</button>
    </form>
    <p class="auth-switch">มีบัญชีอยู่แล้ว? <a th:href="@{/login}">เข้าสู่ระบบ</a></p>
  </section>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
