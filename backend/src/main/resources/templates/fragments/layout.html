<!DOCTYPE html><html lang="th" xmlns:th="http://www.thymeleaf.org"><head th:fragment="head(title)"><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="theme-color" content="#2563EB" /><title th:text="${title + ' | Workmatch'}">Workmatch</title><link rel="icon" type="image/svg+xml" href="/images/workmatch.svg" th:href="@{/images/workmatch.svg}" /><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin" /><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&amp;display=swap" /><link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}" /></head><body>
<!--/* แถบบนสุดตามเอกสารบทที่ 3 หัวข้อ 5 (รูปที่ 38-47)
     นักศึกษา: พื้นขาว เมนู หน้าหลัก / จัดการเรซูเม่
     สถานประกอบการ: พื้นคราม + "สำหรับสถานประกอบการ" เมนู หน้าหลัก / สร้างประกาศงาน (หน้า body ใส่ class theme-company)
     ยังไม่ login: เข้าสู่ระบบ / สมัครสมาชิก */-->
<header class="site-header" th:fragment="navbar"><a class="skip-link" href="#main">ข้ามไปเนื้อหาหลัก</a><div class="nav-wrap">
  <a class="brand" href="/" th:href="${role == 'STUDENT'} ? @{/student/dashboard} : (${role == 'COMPANY'} ? @{/company/jobs} : @{/})">
    <img th:if="${role != 'COMPANY'}" src="/images/workmatch.svg" th:src="@{/images/workmatch.svg}" alt="Workmatch หน้าหลัก" width="140" height="30" />
    <img th:if="${role == 'COMPANY'}" src="/images/workmatch-light.svg" th:src="@{/images/workmatch-light.svg}" alt="Workmatch หน้าหลัก" width="140" height="30" />
    <span class="brand-sub" th:if="${role == 'COMPANY'}">สำหรับสถานประกอบการ</span>
  </a>
  <nav class="nav-links" aria-label="เมนูหลัก">
    <th:block th:if="${role == 'STUDENT'}"><a th:href="@{/student/dashboard}">หน้าหลัก</a><a th:href="@{/student/resume}">จัดการเรซูเม่</a></th:block>
    <th:block th:if="${role == 'COMPANY'}"><a th:href="@{/company/jobs}">หน้าหลัก</a><a th:href="@{/company/jobs/new}">สร้างประกาศงาน</a></th:block>
    <th:block th:if="${role == null}"><a th:href="@{/login}">เข้าสู่ระบบ</a><a class="button sm nav-cta" th:href="@{/register}">สมัครสมาชิก</a></th:block>
  </nav>
  <details class="user-menu" th:if="${role != null}">
    <summary aria-label="เมนูบัญชีผู้ใช้"><span class="avatar" aria-hidden="true" th:text="${#strings.isEmpty(displayName) ? '?' : #strings.substring(displayName, 0, 1)}">ณ</span></summary>
    <div class="menu-panel">
      <strong th:text="${displayName}">ชื่อผู้ใช้</strong>
      <span th:text="${role == 'COMPANY' ? 'บัญชีสถานประกอบการ' : 'บัญชีนักศึกษา'}">บัญชีนักศึกษา</span>
      <form method="post" th:action="@{/logout}"><button class="danger-ghost" type="submit">ออกจากระบบ</button></form>
    </div>
  </details>
</div></header>
<!--/* หน้า login / สมัครสมาชิกไม่มี header ตามรูปที่ 33-35 จึงเรียกเฉพาะสคริปต์ */-->
<th:block th:fragment="scripts"><script src="/js/app.js" th:src="@{/js/app.js}" defer="defer"></script></th:block>
<footer class="footer" th:fragment="footer"><div class="container"><span>Workmatch · ระบบจับคู่และแนะนำการเตรียมความพร้อมสำหรับสหกิจศึกษา</span><span>โครงงานมหาวิทยาลัยพะเยา</span></div><script src="/js/app.js" th:src="@{/js/app.js}" defer="defer"></script></footer></body></html>
