<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('บันทึกข้อผิดพลาด')}"><title>บันทึกข้อผิดพลาด | Workmatch</title></head>
<!--/* หน้าจอบันทึกข้อผิดพลาดของระบบ ตามเอกสาร รูปที่ 52 (200 รายการล่าสุด ไม่มี stack trace หรือรหัสผ่าน) */-->
<body class="admin-body">
<aside th:replace="~{fragments/layout :: adminSidebar(${section})}"></aside>
<main id="main" class="admin-main">
<div class="page-title"><h1>บันทึกข้อผิดพลาดของระบบ (System Error Logs)</h1><p>รายงานข้อผิดพลาดที่เกิดขึ้น 200 รายการล่าสุด เพื่อใช้วิเคราะห์และแก้ไขปัญหา</p></div>
<div class="card empty" th:if="${#lists.isEmpty(logs)}"><p>ยังไม่มีข้อผิดพลาด</p></div>
<section class="card table-card" th:if="${not #lists.isEmpty(logs)}" aria-label="ข้อผิดพลาดล่าสุด">
  <div class="table-wrap">
    <table>
      <thead><tr><th scope="col">เวลา</th><th scope="col">ระดับ</th><th scope="col">ส่วนของระบบ</th><th scope="col">หน้า</th><th scope="col">ข้อผิดพลาด</th><th scope="col">ผู้ใช้</th></tr></thead>
      <tbody>
        <tr th:each="l : ${logs}">
          <td style="white-space:nowrap" th:text="${@fmt.dateTime(l.occurredAt)}">31 ส.ค. 2569 10:00</td>
          <td><span class="status" th:classappend="${l.level == 'ERROR'} ? 'CLOSED' : 'PENDING'" th:text="${l.level}">ERROR</span></td>
          <td th:text="${l.source}">NLP</td>
          <td><code th:text="${l.path}">GET /</code><div class="muted" style="font-size:.78rem" th:if="${l.httpStatus != null}" th:text="${'HTTP ' + l.httpStatus}">HTTP 500</div></td>
          <td><strong style="font-size:.84rem" th:text="${l.errorType}">IllegalStateException</strong><div class="log-msg" th:text="${l.message}">ข้อความ</div></td>
          <td style="font-size:.84rem" th:text="${l.userEmail != null ? l.userEmail : '-'}">-</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body></html>
