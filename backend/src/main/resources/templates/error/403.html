<!DOCTYPE html>
<!--/* งาน A5 (ธนวัฒน์): ไม่มีสิทธิ์เข้าหน้า เช่น นักศึกษาเปิดหน้าของบริษัท หรือฟอร์มไม่มี CSRF token */-->
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ไม่มีสิทธิ์เข้าถึง')}"><title>ไม่มีสิทธิ์เข้าถึง | Workmatch</title></head>
<body><header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container main"><section class="card empty error-page">
<div class="empty-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
<p class="error-code">ERROR 403</p>
<h1>คุณไม่มีสิทธิ์เข้าถึงหน้านี้</h1>
<p>หน้านี้สำหรับผู้ใช้อีกบทบาทหนึ่ง (นักศึกษา หรือ บริษัท) หรือเซสชันหมดอายุ ลองกลับหน้าหลักหรือเข้าสู่ระบบใหม่</p>
<div class="actions"><a class="button" th:href="${role == 'STUDENT'} ? @{/student/dashboard} : (${role == 'COMPANY'} ? @{/company/jobs} : @{/login})">กลับหน้าหลัก</a><a class="button secondary" th:href="@{/login}">เข้าสู่ระบบใหม่</a></div>
</section></main>
<footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
