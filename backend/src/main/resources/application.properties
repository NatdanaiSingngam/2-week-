# ==== Workmatch · Backend · ตั้งค่าหลักของ Spring Boot ====
# หน้าที่: ที่อยู่ฐานข้อมูล MySQL (อ่านรหัสผ่านจาก DB_USER / DB_PASSWORD), ที่อยู่ NLP service, ขนาดไฟล์อัปโหลด
# ใช้โดย: Spring Boot ตอนเปิดระบบ (ทดสอบใช้ backend/src/test/resources/application.properties แทน)
# ====
spring.application.name=workmatch
server.port=8080

# ---------- ฐานข้อมูล MySQL ----------
# ห้ามเขียนรหัสผ่านจริงในไฟล์นี้ ให้ตั้งตัวแปรสภาพแวดล้อม DB_USER และ DB_PASSWORD แทน
spring.datasource.url=jdbc:mysql://localhost:3306/workmatch?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Bangkok&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ให้ Hibernate สร้าง/อัปเดตตารางเองตอนพัฒนา
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Bangkok

# ---------- service NLP ของณัฐดนัย (FastAPI) ----------
nlp.base-url=http://localhost:8000

# ---------- หน้า error ----------
# ไม่ส่ง stack trace / ข้อความภายในออกไปให้ผู้ใช้ (devtools เปิดไว้เป็นค่าเริ่มต้นตอนพัฒนา จึงต้องปิดเอง)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
# หน้า error ภาษาไทยอยู่ที่ templates/error.html, error/403.html, error/404.html (งาน A5)

# ---------- อัปโหลดไฟล์ (เรซูเม่ PDF, เอกสาร ภ.พ.20) ไม่เกิน 5MB ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- บัญชีผู้ดูแลระบบ (ไม่บังคับ) ----------
# ตั้งผ่านตัวแปรสภาพแวดล้อม WORKMATCH_ADMIN_EMAIL / WORKMATCH_ADMIN_PASSWORD เพื่อสร้างบัญชี ADMIN ตอนเปิดระบบ (ถ้ายังไม่มี)
# ห้ามเขียนรหัสผ่านจริงในไฟล์นี้ (profile demo สร้าง admin@demo.workmatch.test ให้เอง)
workmatch.admin.email=${WORKMATCH_ADMIN_EMAIL:}
workmatch.admin.password=${WORKMATCH_ADMIN_PASSWORD:}
